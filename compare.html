<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedHub — сравнение товаров</title>
  <meta name="description" content="Сравнение до 3 товаров Aesculap на MedHub. Быстрый выбор для клиник." />
  <link rel="canonical" href="https://medhub.ru/compare.html" />
  <meta property="og:title" content="MedHub — сравнение товаров" />
  <meta property="og:description" content="Сравнение до 3 товаров Aesculap на MedHub." />
  <meta property="og:image" content="https://medhub.ru/og-image.jpg" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Golos+Text:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="page-shell site-nav">
      <div class="site-logo">
        <a href="/" class="site-logo__title">MedHub</a>
        <span class="site-logo__tag">B2B маркетплейс</span>
      </div>
      <div class="site-actions">
        <button class="header-btn outline cart-button" data-cart-toggle>
          🛒 Корзина <span class="badge" id="cart-count">0</span>
        </button>
        <a class="header-btn primary" href="/admin/login.html">Войти</a>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="page-section compare-panel">
      <div class="section-heading">
        <h2>Сравнение товаров</h2>
        <button class="btn outline" type="button" data-clear-compare>Очистить список</button>
      </div>
      <div id="compare-empty" style="padding:40px;text-align:center;color:var(--text-muted)">Добавьте до 3 товаров в сравнение из каталога.</div>
      <div id="compare-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;"></div>
      <table id="compare-table" class="spec-table" style="width:100%;margin-top:24px;display:none"></table>
    </div>
  </main>

  <aside class="cart-drawer" aria-label="Корзина">
    <div class="cart-drawer__header">
      <div>
        <h2>Корзина</h2>
        <p id="cart-total">0 ₽</p>
      </div>
      <button class="close-button" data-close-cart type="button">×</button>
    </div>
    <div class="cart-drawer__body" id="cart-items"></div>
    <div class="cart-drawer__footer">
      <button class="btn primary" type="button" data-submit-cart>Оставить заявку на всё</button>
      <button class="btn outline" type="button" data-clear-cart>Очистить корзину</button>
    </div>
  </aside>

  <div class="drawer modal" id="cart-inquiry-modal">
    <div class="modal__panel">
      <div class="modal__header">
        <h3>Заявка по корзине</h3>
        <button class="close-button" type="button" data-close-cart-inquiry>×</button>
      </div>
      <div class="modal__body">
        <div id="cart-inquiry-items"></div>
        <form data-cart-inquiry-form id="cart-inquiry-form">
          <div class="filter-group"><label>Имя</label><input name="name" required /></div>
          <div class="filter-group"><label>Телефон</label><input name="phone" required /></div>
          <div class="filter-group"><label>Email</label><input name="email" type="email" required /></div>
          <div class="filter-group"><label>Компания</label><input name="company" /></div>
          <div class="filter-group"><label>Комментарий</label><textarea name="message"></textarea></div>
          <div class="modal__footer">
            <button class="btn outline" type="button" data-close-cart-inquiry>Отмена</button>
            <button class="btn primary" type="submit">Отправить заявку</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/compare.js"></script>
</body>
</html>
