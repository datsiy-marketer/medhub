<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — MedHub Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

<div class="admin-login-page">
  <div class="admin-login-card">
    <div class="admin-login-logo">
      <div class="admin-login-logo__icon">⚕</div>
      <div class="admin-login-logo__title">MedHub Admin</div>
      <div class="admin-login-logo__sub">Административная панель</div>
    </div>

    <div id="error-msg" class="admin-login__error hidden">
      Неверный пароль. Попробуйте ещё раз.
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="login-email" value="admin@medhub.ru" readonly style="background:var(--color-bg-dark);">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="form-input" type="password" id="login-password" placeholder="••••••••" autofocus required>
        <div style="font-size:12px;color:var(--color-text-muted);margin-top:4px;">Пароль по умолчанию: <strong>admin123</strong></div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Войти</button>
    </form>

    <div style="text-align:center;margin-top:20px;">
      <a href="../index.html" style="font-size:13px;color:var(--color-text-muted);">← Вернуться на сайт</a>
    </div>
  </div>
</div>

<script>
  // Check if already logged in
  if (sessionStorage.getItem('medhub_admin') === 'true') {
    location.href = 'index.html';
  }

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const pw = document.getElementById('login-password').value;
    const stored = localStorage.getItem('medhub_admin_password') || 'admin123';
    if (pw === stored) {
      sessionStorage.setItem('medhub_admin', 'true');
      location.href = 'index.html';
    } else {
      document.getElementById('error-msg').classList.remove('hidden');
      document.getElementById('login-password').value = '';
      document.getElementById('login-password').focus();
    }
  });
</script>
</body>
</html>
