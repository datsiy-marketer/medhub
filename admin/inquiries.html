<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки — MedHub Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <nav class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <span>⚕</span><span>MedHub</span>
      <span class="admin-sidebar__tag">ADMIN</span>
    </div>
    <div style="padding:8px;">
      <button class="admin-nav__item" onclick="location.href='index.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Дашборд
      </button>
      <button class="admin-nav__item" onclick="location.href='products.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Товары
      </button>
      <button class="admin-nav__item active" onclick="location.href='inquiries.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Заявки
      </button>
      <button class="admin-nav__item" onclick="location.href='settings.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Настройки
      </button>
    </div>
    <div style="margin-top:auto;padding:16px;">
      <a href="../index.html" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;padding:8px;border-radius:8px;text-decoration:none;">← На сайт</a>
      <button onclick="sessionStorage.removeItem('medhub_admin');location.href='login.html'" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;padding:8px;border-radius:8px;background:none;border:none;cursor:pointer;width:100%;">Выйти</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-header">
      <h1 class="admin-header__title">Заявки</h1>
      <div style="display:flex;gap:10px;">
        <select id="status-filter" class="sort-select" onchange="renderInquiries()">
          <option value="">Все статусы</option>
          <option value="new">Новые</option>
          <option value="processing">В работе</option>
          <option value="done">Завершённые</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="clearAllInquiries()" style="color:var(--color-danger);">Очистить все</button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="admin-stats" style="margin-bottom:20px;">
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-total">0</div>
        <div class="admin-stat__label">Всего заявок</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-new" style="color:var(--color-danger);">0</div>
        <div class="admin-stat__label">Новых</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-done" style="color:var(--color-primary);">0</div>
        <div class="admin-stat__label">Завершено</div>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-card__header">
        <div class="admin-card__title" id="inq-count-label">Загрузка...</div>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Дата и время</th>
              <th>Организация</th>
              <th>Контакт / Телефон</th>
              <th>Email</th>
              <th>Товары / Комментарий</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="inquiries-tbody">
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Detail modal -->
<div id="inq-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">Детали заявки</div>
      <button class="modal__close" onclick="document.getElementById('inq-modal').classList.add('hidden')">✕</button>
    </div>
    <div class="modal__body" id="inq-modal-body"></div>
    <div class="modal__footer">
      <button class="btn btn-ghost" onclick="document.getElementById('inq-modal').classList.add('hidden')">Закрыть</button>
    </div>
  </div>
</div>

<script>
  if (sessionStorage.getItem('medhub_admin') !== 'true') location.href = 'login.html';

  const STORAGE_KEY = 'medhub_inquiries';

  function getInquiries() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
  }

  function saveInquiries(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function updateStats() {
    const all = getInquiries();
    document.getElementById('stat-total').textContent = all.length;
    document.getElementById('stat-new').textContent = all.filter(i => i.status === 'new').length;
    document.getElementById('stat-done').textContent = all.filter(i => i.status === 'done').length;
  }

  function renderInquiries() {
    const filter = document.getElementById('status-filter').value;
    let all = getInquiries();
    if (filter) all = all.filter(i => i.status === filter);

    document.getElementById('inq-count-label').textContent = `Заявок: ${all.length}`;
    const tbody = document.getElementById('inquiries-tbody');

    if (all.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-text-muted);">Заявок нет</td></tr>`;
      return;
    }

    tbody.innerHTML = all.map(inq => {
      const date = new Date(inq.date).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
      const statusClass = inq.status === 'new' ? 'status-new' : inq.status === 'processing' ? 'status-processing' : 'status-done';
      const statusText = inq.status === 'new' ? 'Новая' : inq.status === 'processing' ? 'В работе' : 'Завершена';
      const comment = inq.cartItems || inq.message || inq.productName || '—';
      const shortComment = comment.length > 60 ? comment.substring(0, 60) + '...' : comment;

      return `<tr>
        <td style="white-space:nowrap;font-size:13px;color:var(--color-text-muted);">${date}</td>
        <td class="td-name">${inq.company || '—'}</td>
        <td>
          <div style="font-weight:500;">${inq.contact || '—'}</div>
          <a href="tel:${inq.phone}" style="font-size:13px;color:var(--color-primary);">${inq.phone || '—'}</a>
        </td>
        <td style="font-size:13px;"><a href="mailto:${inq.email}" style="color:var(--color-primary);">${inq.email || '—'}</a></td>
        <td style="font-size:13px;color:var(--color-text-muted);max-width:200px;" title="${comment}">${shortComment}</td>
        <td>
          <select class="sort-select" style="font-size:12px;padding:4px 8px;" onchange="updateStatus('${inq.id}', this.value)">
            <option value="new" ${inq.status==='new'?'selected':''}>🔵 Новая</option>
            <option value="processing" ${inq.status==='processing'?'selected':''}>🟡 В работе</option>
            <option value="done" ${inq.status==='done'?'selected':''}>🟢 Завершена</option>
          </select>
        </td>
        <td>
          <div class="admin-table__actions">
            <button class="btn btn-ghost btn-sm" onclick="viewInquiry('${inq.id}')">👁 Детали</button>
            <button class="btn btn-sm" style="background:#fef2f2;color:var(--color-danger);border:1.5px solid #fecaca;" onclick="deleteInquiry('${inq.id}')">🗑</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    updateStats();
  }

  window.updateStatus = function(id, status) {
    const all = getInquiries();
    const idx = all.findIndex(i => i.id === id);
    if (idx >= 0) { all[idx].status = status; saveInquiries(all); updateStats(); }
  };

  window.deleteInquiry = function(id) {
    if (!confirm('Удалить заявку?')) return;
    saveInquiries(getInquiries().filter(i => i.id !== id));
    renderInquiries();
  };

  window.viewInquiry = function(id) {
    const inq = getInquiries().find(i => i.id === id);
    if (!inq) return;
    const date = new Date(inq.date).toLocaleString('ru-RU');
    document.getElementById('inq-modal-body').innerHTML = `
      <div style="display:grid;gap:12px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Дата</div><div>${date}</div></div>
          <div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">ID</div><div style="font-size:12px;color:var(--color-text-muted);">${inq.id}</div></div>
          <div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Организация</div><div style="font-weight:600;">${inq.company || '—'}</div></div>
          <div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Контакт</div><div>${inq.contact || '—'}</div></div>
          <div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Телефон</div><div><a href="tel:${inq.phone}" style="color:var(--color-primary);font-weight:600;">${inq.phone || '—'}</a></div></div>
          <div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Email</div><div><a href="mailto:${inq.email}" style="color:var(--color-primary);">${inq.email || '—'}</a></div></div>
        </div>
        ${inq.productName ? `<div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Товар</div><div style="font-weight:600;">${inq.productName}</div></div>` : ''}
        ${inq.cartItems ? `<div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:6px;">Товары из корзины</div><div style="font-size:13px;background:var(--color-bg-light);padding:12px;border-radius:8px;line-height:1.6;">${inq.cartItems.replace(/; /g, '<br>')}</div></div>` : ''}
        ${inq.message ? `<div><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:6px;">Комментарий</div><div style="font-size:14px;color:var(--color-text-muted);background:var(--color-bg-light);padding:12px;border-radius:8px;">${inq.message}</div></div>` : ''}
        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:6px;">Статус</div>
          <select class="sort-select" onchange="updateStatus('${inq.id}', this.value)">
            <option value="new" ${inq.status==='new'?'selected':''}>🔵 Новая</option>
            <option value="processing" ${inq.status==='processing'?'selected':''}>🟡 В работе</option>
            <option value="done" ${inq.status==='done'?'selected':''}>🟢 Завершена</option>
          </select>
        </div>
      </div>`;
    document.getElementById('inq-modal').classList.remove('hidden');
  };

  window.clearAllInquiries = function() {
    if (!confirm('Удалить все заявки? Это действие необратимо.')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderInquiries();
  };

  document.getElementById('inq-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
  });

  renderInquiries();
</script>
</body>
</html>
