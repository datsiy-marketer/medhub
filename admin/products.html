<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товары — MedHub Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <nav class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <span>⚕</span>
      <span>MedHub</span>
      <span class="admin-sidebar__tag">ADMIN</span>
    </div>
    <div style="padding:8px;">
      <button class="admin-nav__item" onclick="location.href='index.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Дашборд
      </button>
      <button class="admin-nav__item active" onclick="location.href='products.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Товары
      </button>
      <button class="admin-nav__item" onclick="location.href='inquiries.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Заявки
      </button>
      <button class="admin-nav__item" onclick="location.href='settings.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Настройки
      </button>
    </div>
    <div style="margin-top:auto;padding:16px;">
      <a href="../index.html" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;padding:8px;border-radius:8px;text-decoration:none;">← На сайт</a>
      <button onclick="sessionStorage.removeItem('medhub_admin');location.href='login.html'" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;padding:8px;border-radius:8px;background:none;border:none;cursor:pointer;width:100%;">Выйти</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-header">
      <h1 class="admin-header__title">Управление товарами</h1>
      <div style="display:flex;gap:10px;">
        <input type="search" id="prod-search" placeholder="Поиск по названию, бренду, SKU..." class="form-input" style="width:260px;">
        <button class="btn btn-primary" onclick="openProductModal()">+ Добавить товар</button>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-card__header">
        <div class="admin-card__title" id="prod-count-label">Загрузка...</div>
        <div style="display:flex;gap:8px;">
          <select id="cat-filter" class="sort-select">
            <option value="">Все категории</option>
          </select>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Изображение</th>
              <th>Название / SKU</th>
              <th>Бренд</th>
              <th>Категория</th>
              <th>Статусы</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <tr><td colspan="6" style="text-align:center;padding:32px;color:var(--color-text-muted);">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- PRODUCT MODAL -->
<div id="product-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="modal-title">Добавить товар</div>
      <button class="modal__close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal__body">
      <form id="product-form">
        <input type="hidden" id="pf-id" name="id">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="form-group">
            <label class="form-label">Бренд <span>*</span></label>
            <input class="form-input" id="pf-brand" name="brand" required placeholder="Aesculap">
          </div>
          <div class="form-group">
            <label class="form-label">SKU <span>*</span></label>
            <input class="form-input" id="pf-sku" name="sku" required placeholder="BC253R">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Название (RU) <span>*</span></label>
          <input class="form-input" id="pf-name-ru" name="name_ru" required placeholder="Зажим хирургический Kocher">
        </div>
        <div class="form-group">
          <label class="form-label">Название (EN)</label>
          <input class="form-input" id="pf-name-en" name="name_en" placeholder="Kocher Clamp">
        </div>
        <div class="form-group">
          <label class="form-label">Описание (RU) <span>*</span></label>
          <textarea class="form-textarea" id="pf-desc-ru" name="desc_ru" required rows="3" placeholder="Подробное описание товара..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Описание (EN)</label>
          <textarea class="form-textarea" id="pf-desc-en" name="desc_en" rows="2" placeholder="Product description..."></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="form-group">
            <label class="form-label">Категория <span>*</span></label>
            <select class="form-select" id="pf-category" name="category" required onchange="updateSubcatOptions()">
              <option value="">Выберите...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Подкатегория</label>
            <select class="form-select" id="pf-subcategory" name="subcategory">
              <option value="">—</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">URL изображения</label>
          <input class="form-input" id="pf-image" name="image" type="url" placeholder="https://...">
        </div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:4px;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;">
            <input type="checkbox" id="pf-new" name="isNew" style="width:16px;height:16px;accent-color:var(--color-primary);">
            Новинка
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;">
            <input type="checkbox" id="pf-sale" name="isSale" style="width:16px;height:16px;accent-color:var(--color-primary);">
            Акция
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;">
            <input type="checkbox" id="pf-featured" name="isFeatured" style="width:16px;height:16px;accent-color:var(--color-primary);">
            Рекомендуем
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;">
            <input type="checkbox" id="pf-instock" name="inStock" checked style="width:16px;height:16px;accent-color:var(--color-primary);">
            В наличии
          </label>
        </div>

        <div style="margin-top:20px;border-top:1px solid var(--color-border);padding-top:16px;">
          <div style="font-size:13px;font-weight:700;color:var(--color-text-muted);margin-bottom:12px;">ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ</div>
          <div id="specs-list"></div>
          <button type="button" class="btn btn-ghost btn-sm" onclick="addSpecRow()" style="margin-top:8px;">+ Добавить характеристику</button>
        </div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveProduct()">Сохранить</button>
    </div>
  </div>
</div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  if (sessionStorage.getItem('medhub_admin') !== 'true') location.href = 'login.html';

  let allProducts = [];
  let allCategories = [];
  let editingId = null;

  (async function() {
    await I18n.init();
    await MedData.init();
    allProducts = MedData.getProducts();
    allCategories = MedData.getCategories();

    // Populate category filter & modal selects
    const catFilter = document.getElementById('cat-filter');
    const pfCat = document.getElementById('pf-category');
    allCategories.forEach(cat => {
      const t = I18n.t(cat.nameKey);
      catFilter.innerHTML += `<option value="${cat.id}">${t}</option>`;
      pfCat.innerHTML += `<option value="${cat.id}">${t}</option>`;
    });

    document.getElementById('cat-filter').addEventListener('change', renderTable);
    document.getElementById('prod-search').addEventListener('input', renderTable);

    renderTable();
  })();

  function renderTable() {
    const search = document.getElementById('prod-search').value.toLowerCase();
    const catFilter = document.getElementById('cat-filter').value;

    let filtered = allProducts;
    if (search) filtered = filtered.filter(p =>
      p.brand.toLowerCase().includes(search) ||
      p.sku.toLowerCase().includes(search) ||
      (window.getProductName ? getProductName(p) : (I18n.t(p.nameKey) || p.nameKey || '')).toLowerCase().includes(search)
    );
    if (catFilter) filtered = filtered.filter(p => p.category === catFilter);

    document.getElementById('prod-count-label').textContent = `Товаров: ${filtered.length}`;

    const tbody = document.getElementById('products-tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--color-text-muted);">Нет товаров</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(p => {
      const name = window.getProductName ? getProductName(p) : (p.name || I18n.t(p.nameKey) || p.nameKey);
      const cat = allCategories.find(c => c.id === p.category);
      const catName = cat ? I18n.t(cat.nameKey) : p.category;
      const badges = [];
      if (p.isNew) badges.push(`<span class="badge badge-new" style="font-size:10px;">Новинка</span>`);
      if (p.isSale) badges.push(`<span class="badge badge-sale" style="font-size:10px;">Акция</span>`);
      if (p.isFeatured) badges.push(`<span class="badge badge-featured" style="font-size:10px;">Реком.</span>`);

      return `<tr>
        <td><img src="${p.image}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--color-border);" onerror="this.style.display='none'" alt="${name}"></td>
        <td>
          <div class="td-name">${name}</div>
          <div class="td-brand">SKU: ${p.sku}</div>
        </td>
        <td>${p.brand}</td>
        <td style="font-size:13px;color:var(--color-text-muted);">${catName}</td>
        <td>${badges.join(' ') || '<span style="color:var(--color-text-light);font-size:13px;">—</span>'}</td>
        <td>
          <div class="admin-table__actions">
            <button class="btn btn-ghost btn-sm" onclick='openProductModal(${JSON.stringify(p).replace(/'/g, "\\'")})'>✏ Ред.</button>
            <a href="../product.html?slug=${p.slug}" target="_blank" class="btn btn-ghost btn-sm">👁</a>
            <button class="btn btn-sm" style="background:#fef2f2;color:var(--color-danger);border:1.5px solid #fecaca;" onclick="deleteProduct('${p.id}')">🗑</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  window.updateSubcatOptions = function() {
    const catId = document.getElementById('pf-category').value;
    const cat = allCategories.find(c => c.id === catId);
    const sel = document.getElementById('pf-subcategory');
    sel.innerHTML = '<option value="">—</option>';
    if (cat) {
      cat.subcategories.forEach(sub => {
        sel.innerHTML += `<option value="${sub.id}">${I18n.t(sub.nameKey)}</option>`;
      });
    }
  };

  window.addSpecRow = function(key = '', val = '') {
    const list = document.getElementById('specs-list');
    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;';
    row.innerHTML = `
      <input class="form-input spec-key" placeholder="Параметр" value="${key}" style="font-size:13px;">
      <input class="form-input spec-val" placeholder="Значение" value="${val}" style="font-size:13px;">
      <button type="button" onclick="this.closest('div').remove()" class="btn btn-sm" style="background:#fef2f2;color:var(--color-danger);border:1.5px solid #fecaca;padding:0 10px;">✕</button>`;
    list.appendChild(row);
  };

  window.openProductModal = function(product = null) {
    editingId = product ? product.id : null;
    document.getElementById('modal-title').textContent = product ? 'Редактировать товар' : 'Добавить товар';
    document.getElementById('specs-list').innerHTML = '';

    if (product) {
      document.getElementById('pf-id').value = product.id;
      document.getElementById('pf-brand').value = product.brand || '';
      document.getElementById('pf-sku').value = product.sku || '';
      document.getElementById('pf-image').value = product.image || '';
      document.getElementById('pf-new').checked = product.isNew || false;
      document.getElementById('pf-sale').checked = product.isSale || false;
      document.getElementById('pf-featured').checked = product.isFeatured || false;
      document.getElementById('pf-instock').checked = product.inStock !== false;

      // Load current translations from localStorage or use key as fallback
      const ruTrans = JSON.parse(localStorage.getItem('medhub_translations_ru') || '{}');
      const enTrans = JSON.parse(localStorage.getItem('medhub_translations_en') || '{}');
      document.getElementById('pf-name-ru').value = ruTrans[product.nameKey] || I18n.t(product.nameKey) || '';
      document.getElementById('pf-name-en').value = enTrans[product.nameKey] || '';
      document.getElementById('pf-desc-ru').value = ruTrans[product.descriptionKey] || I18n.t(product.descriptionKey) || '';
      document.getElementById('pf-desc-en').value = enTrans[product.descriptionKey] || '';

      document.getElementById('pf-category').value = product.category || '';
      updateSubcatOptions();
      document.getElementById('pf-subcategory').value = product.subcategory || '';

      if (product.specs) {
        Object.entries(product.specs).forEach(([k, v]) => addSpecRow(k, v));
      }
    } else {
      document.getElementById('product-form').reset();
      document.getElementById('pf-instock').checked = true;
    }

    document.getElementById('product-modal').classList.remove('hidden');
  };

  window.closeModal = function() {
    document.getElementById('product-modal').classList.add('hidden');
    editingId = null;
  };

  window.saveProduct = function() {
    const form = document.getElementById('product-form');
    if (!form.reportValidity()) return;

    const nameRu = document.getElementById('pf-name-ru').value.trim();
    const nameEn = document.getElementById('pf-name-en').value.trim();
    const descRu = document.getElementById('pf-desc-ru').value.trim();
    const descEn = document.getElementById('pf-desc-en').value.trim();
    const brand = document.getElementById('pf-brand').value.trim();
    const sku = document.getElementById('pf-sku').value.trim();
    const category = document.getElementById('pf-category').value;
    const subcategory = document.getElementById('pf-subcategory').value;
    const image = document.getElementById('pf-image').value.trim() ||
      `https://placehold.co/600x400/f8fafc/64748b?text=${encodeURIComponent(brand)}`;

    const id = editingId || `admin-${Date.now()}`;
    const slug = editingId
      ? (MedData.getById(editingId)?.slug || `${brand.toLowerCase()}-${sku.toLowerCase()}`.replace(/\s+/g, '-'))
      : `${brand.toLowerCase()}-${sku.toLowerCase()}`.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

    const nameKey = editingId ? (MedData.getById(editingId)?.nameKey || `prod_${id}_name`) : `prod_${id}_name`;
    const descKey = editingId ? (MedData.getById(editingId)?.descriptionKey || `prod_${id}_desc`) : `prod_${id}_desc`;

    // Collect specs
    const specs = {};
    document.querySelectorAll('#specs-list > div').forEach(row => {
      const k = row.querySelector('.spec-key').value.trim();
      const v = row.querySelector('.spec-val').value.trim();
      if (k && v) specs[k] = v;
    });

    // Save translations to localStorage
    const ruTrans = JSON.parse(localStorage.getItem('medhub_translations_ru') || '{}');
    const enTrans = JSON.parse(localStorage.getItem('medhub_translations_en') || '{}');
    ruTrans[nameKey] = nameRu;
    ruTrans[descKey] = descRu;
    enTrans[nameKey] = nameEn || nameRu;
    enTrans[descKey] = descEn || descRu;
    localStorage.setItem('medhub_translations_ru', JSON.stringify(ruTrans));
    localStorage.setItem('medhub_translations_en', JSON.stringify(enTrans));

    const productData = {
      id, slug, brand, sku, nameKey, descriptionKey: descKey,
      category, subcategory,
      image, images: [image],
      isNew: document.getElementById('pf-new').checked,
      isSale: document.getElementById('pf-sale').checked,
      isFeatured: document.getElementById('pf-featured').checked,
      inStock: document.getElementById('pf-instock').checked,
      specs,
      _adminCreated: !editingId,
      tags: []
    };

    MedData.saveProductOverride(id, productData);
    allProducts = MedData.getProducts();
    closeModal();
    renderTable();
    showAdminToast(editingId ? 'Товар обновлён' : 'Товар добавлен');
  };

  window.deleteProduct = function(id) {
    if (!confirm('Удалить товар?')) return;
    MedData.deleteProductOverride(id);
    allProducts = MedData.getProducts();
    renderTable();
    showAdminToast('Товар удалён');
  };

  function showAdminToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--color-text);color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:var(--shadow-lg);';
    t.textContent = '✓ ' + msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }
  window.showAdminToast = showAdminToast;

  // Close modal on backdrop click
  document.getElementById('product-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
