<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MedHub Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <nav class="admin-sidebar" aria-label="Admin navigation">
    <div class="admin-sidebar__logo">
      <span>⚕</span>
      <span>MedHub</span>
      <span class="admin-sidebar__tag">ADMIN</span>
    </div>

    <div style="padding:8px;">
      <button class="admin-nav__item active" onclick="location.href='index.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Дашборд
      </button>
      <button class="admin-nav__item" onclick="location.href='products.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Товары
      </button>
      <button class="admin-nav__item" onclick="location.href='inquiries.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Заявки
        <span id="sidebar-new-badge" style="margin-left:auto;background:var(--color-danger);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:2px 7px;display:none;"></span>
      </button>
      <button class="admin-nav__item" onclick="location.href='settings.html'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Настройки
      </button>
    </div>

    <div style="margin-top:auto;padding:16px;">
      <a href="../index.html" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;padding:8px;border-radius:8px;text-decoration:none;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#64748b'">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        На сайт
      </a>
      <button onclick="logout()" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;padding:8px;border-radius:8px;background:none;border:none;cursor:pointer;width:100%;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#64748b'">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="admin-main">
    <div class="admin-header">
      <h1 class="admin-header__title">Дашборд</h1>
      <div style="font-size:13px;color:var(--color-text-muted);" id="current-date"></div>
    </div>

    <!-- STATS -->
    <div class="admin-stats">
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-products">—</div>
        <div class="admin-stat__label">Товаров в каталоге</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-inquiries">—</div>
        <div class="admin-stat__label">Всего заявок</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-new" style="color:var(--color-danger);">—</div>
        <div class="admin-stat__label">Новых заявок</div>
      </div>
    </div>

    <!-- RECENT INQUIRIES -->
    <div class="admin-card" style="margin-bottom:24px;">
      <div class="admin-card__header">
        <div class="admin-card__title">Последние заявки</div>
        <a href="inquiries.html" class="btn btn-ghost btn-sm">Все заявки →</a>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Организация</th>
              <th>Контакт</th>
              <th>Телефон</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="recent-inquiries-body">
            <tr><td colspan="5" style="text-align:center;color:var(--color-text-muted);padding:32px;">Заявок пока нет</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="admin-card">
      <div class="admin-card__header">
        <div class="admin-card__title">Быстрые действия</div>
      </div>
      <div style="padding:24px;display:flex;gap:12px;flex-wrap:wrap;">
        <a href="products.html" class="btn btn-primary">Управление товарами</a>
        <a href="inquiries.html" class="btn btn-outline">Просмотр заявок</a>
        <a href="settings.html" class="btn btn-ghost">Настройки сайта</a>
        <a href="../catalog.html" target="_blank" class="btn btn-ghost">Открыть каталог</a>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/data.js"></script>
<script>
  // Auth guard
  if (sessionStorage.getItem('medhub_admin') !== 'true') {
    location.href = 'login.html';
  }

  function logout() {
    sessionStorage.removeItem('medhub_admin');
    location.href = 'login.html';
  }
  window.logout = logout;

  // Date
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // Load stats
  (async function() {
    await MedData.init();
    const products = MedData.getProducts();
    document.getElementById('stat-products').textContent = products.length;

    let inquiries = [];
    try { inquiries = JSON.parse(localStorage.getItem('medhub_inquiries')) || []; } catch {}
    document.getElementById('stat-inquiries').textContent = inquiries.length;

    const newCount = inquiries.filter(i => i.status === 'new').length;
    document.getElementById('stat-new').textContent = newCount;

    // Sidebar badge
    if (newCount > 0) {
      const badge = document.getElementById('sidebar-new-badge');
      badge.textContent = newCount;
      badge.style.display = '';
    }

    // Recent inquiries (last 5)
    const tbody = document.getElementById('recent-inquiries-body');
    const recent = inquiries.slice(0, 5);
    if (recent.length > 0) {
      tbody.innerHTML = recent.map(inq => {
        const date = new Date(inq.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
        const statusClass = inq.status === 'new' ? 'status-new' : inq.status === 'processing' ? 'status-processing' : 'status-done';
        const statusText = inq.status === 'new' ? 'Новая' : inq.status === 'processing' ? 'В работе' : 'Завершена';
        return `<tr>
          <td style="white-space:nowrap;font-size:13px;">${date}</td>
          <td class="td-name">${inq.company || '—'}</td>
          <td>${inq.contact || '—'}</td>
          <td><a href="tel:${inq.phone}" style="color:var(--color-primary);">${inq.phone || '—'}</a></td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        </tr>`;
      }).join('');
    }
  })();
</script>
</body>
</html>
